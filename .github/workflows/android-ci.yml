name: Android Build Check

on:
  push:
    branches:
      - version-0.0.4
  pull_request:
    branches:
      - version-0.0.4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager was not found under $ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VisionEx-v0.0.4-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
